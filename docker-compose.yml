# Todo el proyecto con un comando: docker compose up --build  →  http://localhost:4200
# Las claves van en .env (copia de .env.example). Solo la web publica puerto; la API, el Duende y el análisis de demos
# quedan dentro. Las demos que se dejen a mano van en ./demos (P12).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ttcl
      POSTGRES_USER: ttcl
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ttcl}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttcl -d ttcl"]
      interval: 5s
      retries: 10

  duende:
    build: ./duende
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.5-pro}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-20000}
      DUENDE_MAX_TOKENS: ${DUENDE_MAX_TOKENS:-1024}
      DUENDE_DAILY_LIMIT: ${DUENDE_DAILY_LIMIT:-200}
      # Con Gemini, el chat puede consultar a la API lo que no está en los resúmenes (P9).
      API_URL: http://api:8080
      DUENDE_MAX_CONSULTAS: ${DUENDE_MAX_CONSULTAS:-4}

  # Análisis de demos de CS2 (P12): lee cada demo y devuelve lo que hizo cada uno en cada ronda. No guarda nada.
  analisis:
    build: ./analisis
    environment:
      TTCL_DEMOS_DIR: /demos
      ANALISIS_MAX_MB: ${ANALISIS_MAX_MB:-800}
      ANALISIS_TIMEOUT_S: ${ANALISIS_TIMEOUT_S:-300}
    volumes:
      - ./demos:/demos:ro

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      duende:
        condition: service_started
      analisis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/ttcl
      DB_USER: ttcl
      DB_PASSWORD: ${DB_PASSWORD:-ttcl}
      DUENDE_URL: http://duende:8000
      TTCL_DEMO: ${TTCL_DEMO:-true}
      TTCL_ZONA_HORARIA: ${TTCL_ZONA_HORARIA:-Europe/Madrid}
      TTCL_EQUIPO_JSON: /config/equipo.json
      FACEIT_API_KEY: ${FACEIT_API_KEY:-}
      SMITE2_API_BASE: ${SMITE2_API_BASE:-}
      SMITE2_DEV_ID: ${SMITE2_DEV_ID:-}
      SMITE2_AUTH_KEY: ${SMITE2_AUTH_KEY:-}
      SYNC_INTERVAL_MIN: ${SYNC_INTERVAL_MIN:-60}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_LANG: ${DISCORD_LANG:-es}
      DISCORD_RESUMEN_SEMANAL: ${DISCORD_RESUMEN_SEMANAL:-0 0 10 * * MON}
      # Demos de CS2 (P12): el trabajador de análisis, el token de descargas de FACEIT y la carpeta de demos.
      ANALISIS_URL: http://analisis:8001
      ANALISIS_INTERVALO_MIN: ${ANALISIS_INTERVALO_MIN:-15}
      FACEIT_DOWNLOADS_TOKEN: ${FACEIT_DOWNLOADS_TOKEN:-}
      TTCL_DEMOS_DIR: /demos
    volumes:
      - ./config:/config:ro
      - ./demos:/demos:ro

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"

volumes:
  pgdata:

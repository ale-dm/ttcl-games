# Perfil por defecto: H2 en memoria y datos de ejemplo. Arranca sin instalar nada más.
# Para Postgres: SPRING_PROFILES_ACTIVE=postgres (ver application-postgres.yml).
spring:
  application:
    name: ttcl-api
  # Las claves (.env en la raíz del proyecto) también se leen al arrancar en local, desde api/ o desde la raíz.
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: jdbc:h2:mem:ttcl;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

ttcl:
  # Genera jugadores y partidas de ejemplo si la base está vacía.
  demo: ${TTCL_DEMO:true}
  # Equipo real (copia de config/equipo.example.json). Si existe, se carga al arrancar y no se generan datos demo.
  equipo-json: ${TTCL_EQUIPO_JSON:../config/equipo.json}
  # Zona del equipo: con ella se sabe a qué hora del día se jugó cada partida (mañana, tarde, noche, madrugada).
  zona-horaria: ${TTCL_ZONA_HORARIA:Europe/Madrid}
  duende:
    url: ${DUENDE_URL:http://localhost:8000}
    timeout-ms: ${DUENDE_TIMEOUT_MS:60000}
  faceit:
    api-key: ${FACEIT_API_KEY:}
    base: ${FACEIT_API_BASE:https://open.faceit.com/data/v4}
  smite2:
    base: ${SMITE2_API_BASE:}
    dev-id: ${SMITE2_DEV_ID:}
    auth-key: ${SMITE2_AUTH_KEY:}
  sync:
    intervalo-min: ${SYNC_INTERVAL_MIN:60}
    limite: ${SYNC_LIMITE:20}
  # Webhook de un canal de Discord (P11): si está, la API publica ahí las partidas nuevas tras cada sincronización, con
  # lo que dice el Duende, y el resumen de la semana. Vacío: no publica nada (el bot del grupo puede leer /api/novedades).
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    lang: ${DISCORD_LANG:es}
    # Cuándo se publica el resumen de la semana, en la zona del equipo (cron de Spring: segundo minuto hora día mes día-semana).
    resumen-semanal: ${DISCORD_RESUMEN_SEMANAL:0 0 10 * * MON}
